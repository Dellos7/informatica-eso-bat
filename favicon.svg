<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Cayman Theme Gradient: armonizado con el gradiente de la cabecera de la web -->
    <linearGradient id="caymanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155799" />
      <stop offset="50%" stop-color="#157878" />
      <stop offset="100%" stop-color="#159957" />
    </linearGradient>

    <!-- Gradiente Cyan para los corchetes angulares < > -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gradiente Verde Neón para la barra de cierre / -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Resplandor tecnológico sutil -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Marco exterior con forma squircle y degradado Cayman -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#caymanGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Pantalla interior oscura de terminal -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="10" fill="#090d16" />
  
  <!-- Barra superior de la consola -->
  <line x1="5.5" y1="17.5" x2="58.5" y2="17.5" stroke="#1e293b" stroke-width="1" />
  
  <!-- Botones de ventana tipo terminal (rojo, amarillo, verde) -->
  <circle cx="13" cy="11.5" r="2.2" fill="#ef4444" />
  <circle cx="19" cy="11.5" r="2.2" fill="#f59e0b" />
  <circle cx="25" cy="11.5" r="2.2" fill="#10b981" />

  <!-- Indicador LED tech en la esquina superior derecha -->
  <circle cx="51" cy="11.5" r="1.5" fill="#38bdf8" opacity="0.75" />

  <!-- Elementos de código centrales: < / > (representando programación, informática y robótica) -->
  <g filter="url(#glow)">
    <!-- Corchete de apertura < -->
    <path d="M 23 27 L 15 37 L 23 47" fill="none" stroke="url(#bracketGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Barra divisoria / -->
    <path d="M 35 25 L 29 49" fill="none" stroke="url(#slashGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Corchete de cierre > -->
    <path d="M 41 27 L 49 37 L 41 47" fill="none" stroke="url(#bracketGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
