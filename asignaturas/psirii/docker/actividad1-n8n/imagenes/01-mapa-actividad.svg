<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="title desc"><title id="title">Tu recorrido: siete pasos</title><desc id="desc">Avanza cuando funcione la comprobación del paso actual.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect x="1" y="1" width="958" height="758" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="32" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start">Tu recorrido: siete pasos</text><text x="32" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="400" text-anchor="start">Avanza cuando funcione la comprobación del paso actual.</text><rect x="32" y="116" width="896" height="72" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="69" cy="152" r="23" fill="#1d4ed8"/><text x="69" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="110" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Preparar Docker</text><text x="110" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="400" text-anchor="start">Comprueba hello-world y crea la carpeta del proyecto.</text><rect x="32" y="204" width="896" height="72" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="69" cy="240" r="23" fill="#1d4ed8"/><text x="69" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="110" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Levantar n8n</text><text x="110" y="259" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="400" text-anchor="start">Revisa el Compose y crea la cuenta; túnel detenido.</text><rect x="32" y="292" width="896" height="72" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="69" cy="328" r="23" fill="#1d4ed8"/><text x="69" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="110" y="321" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Probar en local</text><text x="110" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="400" text-anchor="start">Webhook → respuesta fija; todavía sin IA.</text><rect x="32" y="380" width="896" height="72" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="69" cy="416" r="23" fill="#1d4ed8"/><text x="69" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="110" y="409" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Conectar con Internet</text><text x="110" y="435" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="400" text-anchor="start">Inicia el túnel y repite la misma prueba.</text><rect x="32" y="468" width="896" height="72" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="69" cy="504" r="23" fill="#1d4ed8"/><text x="69" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="110" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Añadir IA</text><text x="110" y="523" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="400" text-anchor="start">Obtén ahora la API key y conecta el modelo.</text><rect x="32" y="556" width="896" height="72" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="69" cy="592" r="23" fill="#1d4ed8"/><text x="69" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="110" y="585" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Registrar en Baserow</text><text x="110" y="611" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="400" text-anchor="start">Guarda pregunta, respuesta, sesión, página y fecha.</text><rect x="32" y="644" width="896" height="72" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="69" cy="680" r="23" fill="#1d4ed8"/><text x="69" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="110" y="673" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Integrar y verificar</text><text x="110" y="699" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="400" text-anchor="start">WordPress, publicación del flujo y persistencia.</text></svg>