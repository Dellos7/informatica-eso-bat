<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 715" width="960" height="715" role="img" aria-labelledby="title desc"><title id="title">Dos caminos para llegar a n8n</title><desc id="desc">El navegador usa el puerto del equipo; el túnel usa la red de Docker.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect x="1" y="1" width="958" height="713" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="32" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start">Dos caminos para llegar a n8n</text><text x="32" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="400" text-anchor="start">El navegador usa el puerto del equipo; el túnel usa la red de Docker.</text><rect x="32" y="120" width="896" height="140" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="480" y="164" font-family="Consolas, monospace" font-size="38" fill="#1d4ed8" font-weight="700" text-anchor="middle">127.0.0.1 : 5678 : 5678</text><text x="170" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="middle">Dirección del equipo</text><text x="170" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="400" text-anchor="middle">Solo acceso desde tu PC</text><text x="480" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="middle">Puerto del equipo</text><text x="480" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="400" text-anchor="middle">Lo utiliza el navegador</text><text x="790" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="middle">Puerto del contenedor</text><text x="790" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="400" text-anchor="middle">Aquí escucha n8n</text><rect x="32" y="315" width="360" height="110" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="32" y="333" width="6" height="74" rx="3" fill="#1d4ed8"/><text x="54" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">Desde tu navegador</text><text x="54" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">http://localhost:5678</text><rect x="568" y="315" width="360" height="110" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="568" y="333" width="6" height="74" rx="3" fill="#1d4ed8"/><text x="590" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">Contenedor n8n</text><text x="590" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Puerto interno: 5678</text><path d="M392 370 H568" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="32" y="480" width="360" height="110" rx="18" fill="#fff" stroke="#6d28d9" stroke-width="2"/><rect x="32" y="498" width="6" height="74" rx="3" fill="#6d28d9"/><text x="54" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#6d28d9" font-weight="700" text-anchor="start">Desde cloudflared</text><text x="54" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">http://n8n:5678</text><path d="M392 535 H480 V402 H568" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="32" y="625" width="896" height="56" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="52" y="661" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="start">localhost cambia de significado según dónde se ejecute la petición.</text></svg>