<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="title desc"><title id="title">Paso 6 · Responder y guardar la consulta</title><desc id="desc">Baserow devuelve una fila; la respuesta se toma del nodo Asistente IA.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect x="1" y="1" width="958" height="758" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="32" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start">Paso 6 · Responder y guardar la consulta</text><text x="32" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="400" text-anchor="start">Baserow devuelve una fila; la respuesta se toma del nodo Asistente IA.</text><rect x="32" y="130" width="430" height="90" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="32" y="148" width="6" height="54" rx="3" fill="#1d4ed8"/><text x="54" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">1 · Webhook</text><text x="54" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Recibe message y thread_id</text><rect x="32" y="255" width="430" height="100" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="32" y="273" width="6" height="64" rx="3" fill="#0f766e"/><text x="54" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start">2 · Asistente IA</text><text x="54" y="325" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Basic LLM Chain · genera text</text><rect x="32" y="390" width="430" height="100" rx="18" fill="#fff" stroke="#6d28d9"