<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="title desc"><title id="title">La configuración se conserva; la URL cambia</title><desc id="desc">No confundas la persistencia de n8n con la dirección del túnel.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect x="1" y="1" width="958" height="698" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="32" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start">La configuración se conserva; la URL cambia</text><text x="32" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="400" text-anchor="start">No confundas la persistencia de n8n con la dirección del túnel.</text><rect x="32" y="145" width="260" height="120" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="32" y="163" width="6" height="84" rx="3" fill="#1d4ed8"/><text x="54" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">1 · Antes de down</text><text x="54" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Contenedor n8n</text><text x="54" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Cuenta y flujo guardados</text><rect x="32" y="345" width="260" height="95" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="32" y="363" width="6" height="59" rx="3" fill="#0f766e"/><text x="54" y="381" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start">n8n_data</text><text x="54" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">El mismo volumen</text><path d="M162 265 V345" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="350" y="145" width="260" height="120" rx="18" fill="#fff" stroke="#be123c" stroke-width="2"/><rect x="350" y="163" width="6" height="84" rx="3" fill="#be123c"/><text x="372" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#be123c" font-weight="700" text-anchor="start">2 · Después de down</text><text x="372" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Contenedor eliminado</text><text x="372" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Volumen conservado</text><rect x="350" y="345" width="260" height="95" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="350" y="363" width="6" height="59" rx="3" fill="#0f766e"/><text x="372" y="381" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start">n8n_data</text><text x="372" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">El mismo volumen</text><rect x="668" y="145" width="260" height="120" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="668" y="163" width="6" height="84" rx="3" fill="#0f766e"/><text x="690" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start">3 · Después de up</text><text x="690" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Contenedor nuevo</text><text x="690" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Recupera cuenta y flujo</text><rect x="668" y="345" width="260" height="95" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="668" y="363" width="6" height="59" rx="3" fill="#0f766e"/><text x="690" y="381" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start">n8n_data</text><text x="690" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">El mismo volumen</text><path d="M798 265 V345" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M292 205 H350" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M610 205 H668" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M292 392 H350" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M610 392 H668" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="32" y="485" width="896" height="56" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2"/><text x="52" y="521" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#be123c" font-weight="700" text-anchor="start">down sin -v conserva el volumen; down -v lo elimina.</text><rect x="32" y="575" width="896" height="90" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="54" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">El túnel es independiente del volumen.</text><text x="54" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="400" text-anchor="start">Al recrearlo: nueva URL → actualizar .env y plugin de WordPress.</text></svg>