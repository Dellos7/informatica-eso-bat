<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 525" width="960" height="525" role="img" aria-labelledby="title desc"><title id="title">De la prueba manual al chat funcionando</title><desc id="desc">Mismo dominio, distinta ruta y distinta forma de registrar el webhook.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect x="1" y="1" width="958" height="523" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="32" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start">De la prueba manual al chat funcionando</text><text x="32" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="400" text-anchor="start">Mismo dominio, distinta ruta y distinta forma de registrar el webhook.</text><rect x="32" y="135" width="430" height="260" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="32" y="153" width="6" height="224" rx="3" fill="#1d4ed8"/><text x="54" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">PRUEBA · Test URL</text><text x="54" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">/webhook-test/chat-asistente</text><text x="54" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start"></text><text x="54" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Pulsa Listen for test event.</text><text x="54" y="289" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Úsala al diseñar el flujo.</text><text x="54" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Vuelve a escuchar para otra prueba.</text><rect x="498" y="135" width="430" height="260" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="498" y="153" width="6" height="224" rx="3" fill="#0f766e"/><text x="520" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start">PUBLICADO · Production URL</text><text x="520" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">/webhook/chat-asistente</text><text x="520" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start"></text><text x="520" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Publica o activa el flujo.</text><text x="520" y="289" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">No necesita escucha manual.</text><text x="520" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Es la URL que quedará en el plugin.</text><rect x="32" y="435" width="896" height="56" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="52" y="471" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="start">En ambos casos el dominio del túnel sigue siendo temporal.</text></svg>