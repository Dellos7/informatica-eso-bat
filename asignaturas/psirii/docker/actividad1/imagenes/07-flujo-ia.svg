<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 625" width="960" height="625" role="img" aria-labelledby="title desc"><title id="title">Sustituir la respuesta fija por IA</title><desc id="desc">La salida correcta y la salida de error responden por caminos distintos.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect x="1" y="1" width="958" height="623" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="32" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start">Sustituir la respuesta fija por IA</text><text x="32" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="400" text-anchor="start">La salida correcta y la salida de error responden por caminos distintos.</text><rect x="32" y="190" width="230" height="110" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="32" y="208" width="6" height="74" rx="3" fill="#1d4ed8"/><text x="54" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">Webhook</text><text x="54" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">body.message</text><rect x="365" y="190" width="230" height="110" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="365" y="208" width="6" height="74" rx="3" fill="#0f766e"/><text x="387" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start">Asistente IA</text><text x="387" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Basic LLM Chain</text><text x="387" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anch