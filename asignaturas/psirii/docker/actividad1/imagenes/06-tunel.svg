<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 605" width="960" height="605" role="img" aria-labelledby="title desc"><title id="title">Orden de inicio: 1.º Túnel, 2.º .env, 3.º n8n</title><desc id="desc">En cada clase obtenemos primero la URL del túnel, la anotamos en .env y arrancamos n8n.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect x="1" y="1" width="958" height="603" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="32" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start">Orden de inicio: 1.º Túnel → 2.º .env → 3.º n8n</text><text x="32" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="400" text-anchor="start">En cada clase obtenemos primero la URL del túnel, la anotamos en .env y arrancamos n8n.</text><rect x="32" y="135" width="270" height="120" rx="18" fill="#fff" stroke="#6d28d9" stroke-width="2"/><rect x="32" y="153" width="6" height="84" rx="3" fill="#6d28d9"/><text x="54" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#6d28d9" font-weight="700" text-anchor="start">Dirección pública</text><text x="54" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">https://…free.pinggy.net</text><text x="54" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Entrada desde Internet</text><rect x="345" y="135" width="270" height="120" rx="18" fill="#fff" stroke="#6d28d9" stroke-width="2"/><rect x="345" y="153" width="6" height="84" rx="3" fill="#6d28d9"/><text x="367" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#6d28d9" font-weight="700" text-anchor="start">1.º Túnel Pinggy</text><text x="367" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">up -d tunnel (SSH 443)</text><text x="367" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Genera la URL (60 min)</text><rect x="658" y="135" width="270" height="120" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="658" y="153" width="6" height="84" rx="3" fill="#1d4ed8"/><text x="680" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">n8n</text><text x="680" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">n8n:5678</text><text x="680" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Recibe por red interna</text><path d="M302 195 H345" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M615 195 H658" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="32" y="335" width="420" height="140" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="32" y="353" width="6" height="104" rx="3" fill="#1d4ed8"/><text x="54" y="371" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">2.º Archivo .env</text><text x="54" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Guarda la URL pública</text><text x="54" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">N8N_WEBHOOK_URL=https://…/</text><text x="54" y="461" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Conserva la barra final.</text><rect x="510" y="335" width="418" height="140" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="510" y="353" width="6" height="104" rx="3" fill="#0f766e"/><text x="532" y="371" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start">3.º Arrancar n8n</text><text x="532" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">up -d n8n</text><text x="532" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Inicia ya con la URL pública</text><text x="532" y="461" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">lista en sus webhooks.</text><path d="M452 405 H510" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="32" y="515" width="896" height="56" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="52" y="551" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="start">En cada nueva sesión: 1.º up -d tunnel → 2.º editar .env → 3.º up -d n8n.</text></svg>