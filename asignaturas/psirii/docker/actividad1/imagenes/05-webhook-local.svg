<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 585" width="960" height="585" role="img" aria-labelledby="title desc"><title id="title">El primer flujo tiene solo dos nodos</title><desc id="desc">Primero comprobamos que una petición recibe una respuesta.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect x="1" y="1" width="958" height="583" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="32" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start">El primer flujo tiene solo dos nodos</text><text x="32" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="400" text-anchor="start">Primero comprobamos que una petición recibe una respuesta.</text><rect x="32" y="155" width="260" height="125" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="32" y="173" width="6" height="89" rx="3" fill="#1d4ed8"/><text x="54" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">1 · Petición local</text><text x="54" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">curl envía POST</text><text x="54" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">body.message = pregunta</text><rect x="350" y="155" width="260" height="125" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="350" y="173" width="6" height="89" rx="3" fill="#1d4ed8"/><text x="372" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">2 · Webhook</text><text x="372" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Recibe el JSON</text><text x="372" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Listen for test event</text><rect x="668" y="155" width="260" height="125" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="668" y="173" width="6" height="89" rx="3" fill="#0f766e"/><text x="690" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start">3 · Respuesta</text><text x="690" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Responder al chat</text><text x="690" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Texto plano · 200</text><path d="M292 217 H350" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M610 217 H668" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="205" y="350" width="550" height="110" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="480" y="391" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="middle">Respuesta esperada</text><text x="480" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="400" text-anchor="middle">Hola. El webhook funciona correctamente.</text><path d="M798 280 V315 H480 V350" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="32" y="495" width="896" height="56" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="52" y="531" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="start">En este paso todavía no necesitas modelo, API key ni Baserow.</text></svg>