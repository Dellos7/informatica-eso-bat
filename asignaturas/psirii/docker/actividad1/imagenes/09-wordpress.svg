<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="title desc"><title id="title">No confundas los dos formatos</title><desc id="desc">JSON al entrar en n8n; texto al responder a este plugin.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect x="1" y="1" width="958" height="698" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="32" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start">No confundas los dos formatos</text><text x="32" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="400" text-anchor="start">JSON al entrar en n8n; texto al responder a este plugin.</text><rect x="32" y="135" width="250" height="110" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="32" y="153" width="6" height="74" rx="3" fill="#1d4ed8"/><text x="54" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">Navegador</text><text x="54" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Widget de chat</text><rect x="355" y="135" width="250" height="110" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="355" y="153" width="6" height="74" rx="3" fill="#1d4ed8"/><text x="377" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">WordPress · PHP</text><text x="377" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Plugin Make Chatbot</text><rect x="678" y="135" width="250" height="110" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="678" y="153" width="6" height="74" rx="3"