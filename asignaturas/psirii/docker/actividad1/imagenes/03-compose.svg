<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="title desc"><title id="title">Un archivo, dos servicios y un volumen</title><desc id="desc">El archivo describe el entorno; Docker crea los contenedores.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs><rect x="1" y="1" width="958" height="698" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="32" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start">Un archivo, dos servicios y un volumen</text><text x="32" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="400" text-anchor="start">El archivo describe el entorno; Docker crea los contenedores.</text><rect x="260" y="120" width="440" height="90" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="260" y="138" width="6" height="54" rx="3" fill="#1d4ed8"/><text x="282" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">docker-compose.yml</text><text x="282" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">La receta de los dos servicios</text><path d="M480 210 V240 H240 V280" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M480 240 H720 V280" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="32" y="255" width="896" height="240" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><rect x="56" y="280" width="390" height="160" rx="18" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="56" y="298" width="6" height="124" rx="3" fill="#1d4ed8"/><text x="78" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="start">Servicio: n8n</text><text x="78" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Imagen n8n:2.44.7</text><text x="78" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Editor, webhooks y flujos</text><text x="78" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Acceso local por el puerto 5678</text><rect x="514" y="280" width="390" height="160" rx="18" fill="#fff" stroke="#6d28d9" stroke-width="2"/><rect x="514" y="298" width="6" height="124" rx="3" fill="#6d28d9"/><text x="536" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#6d28d9" font-weight="700" text-anchor="start">Servicio: tunnel</text><text x="536" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Imagen cloudflared:2026.10.3</text><text x="536" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Conexión saliente a Cloudflare</text><text x="536" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Destino: http://n8n:5678</text><text x="480" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1d4ed8" font-weight="400" text-anchor="middle">Compose crea una red interna para ambos servicios.</text><path d="M251 440 V450 H70 V525 H480 V550" fill="none" stroke="#475569" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="260" y="550" width="440" height="110" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="260" y="568" width="6" height="74" rx="3" fill="#0f766e"/><text x="282" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start">Volumen: n8n_data</text><text x="282" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Montado en /home/node/.n8n</text><text x="282" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Los datos quedan fuera del contenedor.</text></svg>