<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔴</text></svg>">
</head>
<body>
  <main class="pokedex-wrapper">
    <section class="pokedex-device" aria-label="Pokédex">
      <!-- Barra superior de la Pokédex -->
      <header class="pokedex-top">
        <div class="pokedex-lights" aria-hidden="true">
          <span class="lens-main"></span>
          <span class="led led-red"></span>
          <span class="led led-yellow"></span>
          <span class="led led-green"></span>
        </div>

        <h1 class="pokedex-title">Pokédex</h1>

        <button
          type="button"
          id="settings-btn"
          class="icon-btn"
          title="Configurar conexión n8n"
          aria-label="Configurar conexión"
          aria-expanded="false"
          aria-controls="settings-dialog"
        >
          ⚙️
        </button>
      </header>

      <!-- Buscador -->
      <form id="search-form" class="search-bar" novalidate>
        <input
          id="pokemon-input"
          type="text"
          placeholder="Buscar Pokémon (ej. pikachu, snorlax, 25...)"
          autocomplete="off"
          aria-label="Nombre o número de Pokémon"
          required
        >
        <button type="submit" id="search-btn" class="search-btn">
          <span class="btn-text">Buscar</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="quick-picks" aria-label="Sugerencias rápidas">
        <button type="button" class="pick-chip" data-pokemon="pikachu">Pikachu</button>
        <button type="button" class="pick-chip" data-pokemon="snorlax">Snorlax</button>
        <button type="button" class="pick-chip" data-pokemon="charizard">Charizard</button>
        <button type="button" class="pick-chip" data-pokemon="bulbasaur">Bulbasaur</button>
        <button type="button" class="pick-chip" data-pokemon="gengar">Gengar</button>
      </div>

      <!-- Pantalla principal de la Pokédex -->
      <div class="screen-bezel">
        <div class="screen" aria-live="polite">
          <!-- Estado inicial -->
          <div id="state-idle" class="screen-state">
            <div class="pokeball-illustration" aria-hidden="true"></div>
            <h2>Listo para buscar</h2>
            <p>Escribe el nombre o número de un Pokémon para ver su ficha.</p>
          </div>

          <!-- Estado cargando -->
          <div id="state-loading" class="screen-state hidden">
            <div class="loader-ring" aria-hidden="true"></div>
            <p id="loading-text">Buscando Pokémon...</p>
          </div>

          <!-- Estado error / no encontrado -->
          <div id="state-error" class="screen-state error-state hidden" role="alert">
            <div class="error-icon" aria-hidden="true">⚠️</div>
            <h2 id="error-title">Pokémon no encontrado</h2>
            <p id="error-desc">No se encontró ningún Pokémon con ese nombre.</p>
          </div>

          <!-- Resultado Pokémon -->
          <article id="state-result" class="pokemon-view hidden">
            <div class="sprite-stage">
              <img id="poke-image" src="" alt="Imagen del Pokémon">
            </div>

            <div class="pokemon-details">
              <div class="pokemon-header">
                <h2 id="poke-ficha">—</h2>
                <span id="poke-type" class="type-badge">—</span>
              </div>

              <dl class="metrics">
                <div class="metric-box">
                  <dt>Altura</dt>
                  <dd id="poke-altura">—</dd>
                </div>
                <div class="metric-box">
                  <dt>Peso</dt>
                  <dd id="poke-peso">—</dd>
                </div>
              </dl>
            </div>
          </article>
        </div>
      </div>

      <!-- Historial visual de Pokémon consultados -->
      <div id="history-bar" class="history-bar hidden">
        <span class="history-label">Vistos recientemente</span>
        <div id="history-list" class="history-list"></div>
      </div>
    </section>
  </main>

  <!-- Modal discreto para configurar la URL del webhook de n8n -->
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-heading">
    <form id="settings-form" method="dialog" class="settings-card">
      <div class="settings-header">
        <h2 id="settings-heading">Conexión con n8n</h2>
        <button type="button" id="close-settings-btn" class="close-btn" aria-label="Cerrar">✕</button>
      </div>

      <label for="base-url">URL de n8n (localhost o túnel Pinggy)</label>
      <input
        id="base-url"
        type="url"
        placeholder="http://localhost:5678"
        required
      >

      <div class="settings-row">
        <div>
          <label for="webhook-mode">Modo del flujo</label>
          <select id="webhook-mode">
            <option value="webhook-test">Test (/webhook-test/...)</option>
            <option value="webhook">Producción (/webhook/...)</option>
          </select>
        </div>
        <div>
          <label for="webhook-path">Path</label>
          <input id="webhook-path" type="text" placeholder="prueba" required>
        </div>
      </div>

      <p class="endpoint-hint">
        Endpoint: <code id="endpoint-preview">http://localhost:5678/webhook-test/prueba</code>
      </p>

      <div class="settings-actions">
        <button type="button" id="reset-settings-btn" class="secondary-btn">Restaurar localhost</button>
        <button type="submit" class="save-btn">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
